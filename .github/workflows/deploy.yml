name: Deploy VK Mini App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Mini App
        run: |
          mkdir -p site
          cp public/index.html site/
          cp public/style.css site/
          cp public/app.js site/
          cp public/config.js site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
